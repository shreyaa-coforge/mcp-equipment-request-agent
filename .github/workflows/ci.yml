name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint, test and MCP smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Pins the evaluation date so eligibility and tenure results are deterministic.
      REFERENCE_DATE: "2026-11-24"
      # No OPENAI_API_KEY: nothing in CI calls the OpenAI API.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Unit tests
        run: pytest -v

      - name: MCP smoke test - minimal one-tool server
        run: python scripts/minimal_client.py

      - name: MCP smoke test - all four tools
        run: python scripts/client_check.py
